[project]
name = "graph-rag"
version = "0.1.0"
description = "지식그래프 바이블 실습 리포지토리 (LLM Wiki, GraphRAG, Ontology, Agent Harness)"
requires-python = ">=3.11"
# core: 전 과정 공통. 실습 01에서 uv sync로 설치
dependencies = [
  "openai>=1.60",
  "neo4j>=5.26",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "networkx>=3.3",
  "tiktoken>=0.8",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9",
]

# 챕터 시작 시점에 uv sync --group {이름} 으로 추가 설치한다.
# 2차수, 3차수 그룹은 해당 차수 교안 제작 시점에 버전을 확정한다 (uv.lock 갱신).
[dependency-groups]
parsing = ["docling>=2.0", "pypdf>=5.0", "fpdf2>=2.8"]   # 실습 03 (1차수 CH1)
graphrag = ["lightrag-hku[api]==1.5.4"]                   # 실습 22 (1차수 CH4, WebUI 포함)
ontology = ["rdflib==7.6.0"]                                # 실습 24 (2차수 CH5)
agent = ["langgraph==1.2.9", "langfuse==4.14.1", "langchain-openai==1.4.1"]   # 실습 28 (2차수 CH6. langchain-openai는 실습 32 ChatOpenAI/with_structured_output용, RUN_09 실측 반영)
eval = ["deepeval==4.1.3", "openevals==0.2.0"]                              # 실습 35 (2차수 CH7)
capstone-finance = ["edgartools==5.43.0", "pandas>=2.2"]               # 3차수 금융
capstone-medical = ["pandas>=2.2", "fhir.resources==8.3.0"]           # 3차수 의료
capstone-research = ["pyalex==0.21", "arxiv==4.0.0"]                   # 3차수 연구
ops = ["fastapi", "uvicorn"]                              # 3차수 Part 4 운영
